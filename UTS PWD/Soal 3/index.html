<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Donasi Online</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f9f9f9; }
        .card { width: 500px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); text-align: center; }
        .logo { width: 60px; height: 60px; margin-bottom: 10px; }
        .banner { background-color: gold; padding: 10px; font-weight: bold; font-size: 13px; margin-bottom: 20px; border-radius: 4px; }
        .form-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; text-align: left; }
        .form-group label { width: 40%; font-weight: bold; font-size: 14px; }
        .form-group input, .form-group select { width: 55%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-submit { background-color: gold; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://via.placeholder.com/60" alt="Logo" class="logo">
        <h2>Formulir Donasi Online</h2>
        
        <div class="banner">
            Terima kasih telah berdonasi! Setiap kontribusi Anda sangat berarti.
        </div>

        <form action="#" method="POST">
            <div class="form-group">
                <label for="nama">Nama Lengkap:</label>
                <input type="text" id="nama" name="nama" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="telepon">Nomor Telepon:</label>
                <input type="tel" id="telepon" name="telepon" required>
            </div>

            <div class="form-group">
                <label for="jumlah">Jumlah Donasi:</label>
                <input type="number" id="jumlah" name="jumlah" min="1000" required>
            </div>

            <div class="form-group">
                <label for="metode">Metode Pembayaran:</label>
                <select id="metode" name="metode">
                    <option value="transfer">Transfer Bank</option>
                    <option value="e-wallet">E-Wallet (Gopay/OVO/Dana)</option>
                    <option value="qris">QRIS</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Donasi Sekarang</button>
        </form>
    </div>

</body>
</html>
